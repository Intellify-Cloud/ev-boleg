<!-- Testimonials -->
<section class="section testimonials-section" id="{{ site.data.sitetext.testimonials.section | default: "testimonials" }}">
    <div class="container">
      <div class="row">
        <div class="col-lg-12 text-center">
          <h2 class="section__heading text-uppercase">{{ site.data.sitetext.testimonials.title }}</h2>
          <h3 class="section__subheading text-muted">{{ site.data.sitetext.testimonials.text | default: "" }}</h3>
        </div>
      </div>
      <div class="row testimonials-section__grid">
      {% for person in site.data.sitetext.testimonials.people %}
        <div class="col-lg-4 testimonials-section__item">
          <blockquote class="testimonial-card">
            <p class="text-muted font-italic testimonial-card__text">{{ person.testimony }}</p>
            <footer class="testimonial-card__author">{{ person.name }}</footer>
          </blockquote>
        </div>
      {% endfor %}
      </div>
    </div>
</section>
<!-- End Testimonials -->
